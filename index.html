<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Party - Jeu Multijoueur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animation de bombe */
        @keyframes bombPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        @keyframes bombExplode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e; }
            50% { text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e; }
        }

        .bomb {
            animation: bombPulse 0.6s infinite;
            font-size: 120px;
        }

        .bomb.exploding {
            animation: bombExplode 0.6s forwards;
        }

        .bomb-danger {
            animation: shake 0.1s infinite, glow 0.5s infinite;
        }

        .timer {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 8px;
            animation: glow 1s infinite;
        }

        .timer.danger {
            color: #ff006e;
            animation: glow 0.3s infinite;
        }

        .fragment {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #00d9ff;
            text-shadow: 0 0 20px #00d9ff;
            animation: float 2s infinite;
        }

        .player-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
        }

        .player-card.active {
            border: 3px solid #ff006e;
            background: rgba(255, 0, 110, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }

        .player-card.eliminated {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .player-card.winner {
            border: 3px solid #ffb700;
            background: rgba(255, 183, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 183, 0, 0.8);
            animation: glow 0.5s infinite;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 217, 255, 0.5);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 18px;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .btn {
            background: linear-gradient(135deg, #ff006e, #ffb700);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 20px;
            border-radius: 8px;
            margin: 8px 0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .message.valid {
            background: rgba(0, 255, 136, 0.2);
            border-left: 4px solid #00ff88;
            color: #00ff88;
        }

        .message.invalid {
            background: rgba(255, 0, 110, 0.2);
            border-left: 4px solid #ff006e;
            color: #ff006e;
        }

        .word-history {
            max-height: 200px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .word-item {
            padding: 6px 0;
            font-size: 14px;
            color: #00d9ff;
        }

        .heart {
            color: #ff006e;
            margin: 0 2px;
        }

        .container-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .lobby-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .lobby-title {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ff006e, #ffb700, #00d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite;
        }

        .controls-section {
            margin: 20px 0;
        }

        .label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d9ff;
        }

        .player-input {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .player-input input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: white;
            margin-right: 8px;
        }

        .player-input input:focus {
            outline: none;
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
        }

        .player-number {
            color: #ffb700;
            font-weight: bold;
            margin-right: 8px;
            width: 30px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        .players-top {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .bomb-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-bottom {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 1024px) {
            .game-bottom {
                grid-template-columns: 1fr;
            }
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
        }

        .end-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .winner-display {
            font-size: 36px;
            margin: 20px 0;
            color: #ffb700;
            animation: glow 1s infinite;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- ÉCRAN LOBBY -->
    <div id="lobbyScreen" class="container-lobby">
        <div class="lobby-card">
            <div class="lobby-title">🎉 BOOM PARTY 🎉</div>
            
            <div class="controls-section">
                <label class="label">Nombre de joueurs</label>
                <select id="playerCount" class="input-field w-full">
                    <option value="4">4 joueurs</option>
                    <option value="5">5 joueurs</option>
                    <option value="6">6 joueurs</option>
                    <option value="7">7 joueurs</option>
                    <option value="8">8 joueurs</option>
                </select>
            </div>

            <div class="controls-section">
                <label class="label">Noms des joueurs</label>
                <div id="playerNameInputs"></div>
            </div>

            <button id="startGameBtn" class="btn w-full mt-8">Lancer la partie</button>
        </div>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="gameScreen" class="hidden game-container">
        <!-- Joueurs en haut -->
        <div class="players-top" id="playersContainer"></div>

        <!-- Centre du jeu -->
        <div class="game-content">
            <div class="bomb-display">
                <div id="bombElement" class="bomb">💣</div>
                <div id="timerDisplay" class="timer">00</div>
                <div class="fragment" id="fragmentDisplay">ING</div>
            </div>
        </div>

        <!-- Bas de l'écran -->
        <div class="game-bottom">
            <!-- Historique à gauche -->
            <div>
                <div class="label" style="color: #00d9ff;">Derniers mots</div>
                <div class="word-history" id="wordHistory"></div>
            </div>

            <!-- Zone de saisie au centre -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="wordInput" 
                    class="input-field" 
                    placeholder="Tapez un mot..."
                    autocomplete="off"
                >
                <button id="submitBtn" class="btn">Valider</button>
            </div>

            <!-- Messages à droite -->
            <div>
                <div class="label" style="color: #00d9ff;">Statut</div>
                <div id="messageDisplay"></div>
            </div>
        </div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="endScreen" class="hidden end-screen">
        <div style="text-align: center;">
            <div style="font-size: 72px; margin-bottom: 20px;">🏆</div>
            <div style="font-size: 32px; margin-bottom: 10px;">Partie terminée !</div>
            <div class="winner-display" id="winnerDisplay"></div>
            <button id="restartBtn" class="btn mt-8">Rejouer</button>
        </div>
    </div>

    <script>
        // ============ FRAGMENTS DATABASE ============
        const FRAGMENTS = [
            // Suffixes courants
            'ing', 'tion', 'ment', 'ness', 'able', 'ible', 'ful', 'less', 'ous', 'ive',
            'ate', 'ize', 'ise', 'er', 'or', 'ist', 'ism', 'ly', 'al', 'ic',
            // Préfixes courants
            'un', 're', 'dis', 'pre', 'pro', 'anti', 'sub', 'super', 'inter', 'trans',
            'auto', 'co', 'de', 'over', 'under', 'mis', 'non', 'semi', 'multi',
            // Syllabes
            'ing', 'tion', 'sion', 'ance', 'ence', 'ure', 'age', 'ism', 'ity',
            'ous', 'ious', 'eous', 'ful', 'less', 'able', 'ible', 'ment', 'ness',
            // Digrammes et trigrammes
            'ch', 'sh', 'th', 'gh', 'ph', 'qu', 'ou', 'ai', 'ei', 'oi',
            'ou', 'au', 'eau', 'uu', 'ee', 'oo', 'tt', 'ss', 'nn', 'll',
            // Mots courts
            'a', 'e', 'i', 'o', 'u', 'y', 'or', 'an', 'en', 'on',
            'la', 'le', 'es', 'est', 'ours', 'eur', 'air', 'eau', 'eau',
            // Plus de syllabes
            'par', 'ble', 'tra', 'stra', 'scra', 'br', 'cr', 'dr', 'fr', 'gr', 'pr', 'tr',
            'ck', 'nk', 'nd', 'nt', 'st', 'ct', 'pt', 'mp', 'ng', 'lt'
        ];

        function normalizeWord(word) {
            return word.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        }

        const VALID_WORDS = [
            'AMOUR', 'MAISON', 'CHIEN', 'CHAT', 'VOITURE', 'ECOLE', 'FAMILLE', 'TRAVAIL',
            'VILLE', 'PAYS', 'MONDE', 'JOUR', 'NUIT', 'MER', 'MONTAGNE', 'FORET',
            'FLEUR', 'OISEAU', 'JOUER', 'MANGER', 'BOIRE', 'DORMIR', 'COURIR', 'PARLER',
            'LIRE', 'ECRIRE', 'VOIR', 'ENTENDRE', 'SENTIR', 'AIMER', 'DETESTER', 'AIDER',
            'DONNER', 'PRENDRE', 'METTRE', 'DIRE', 'POUVOIR', 'SAVOIR', 'VOULOIR',
            'ALLER', 'VENIR', 'ARRIVER', 'PARTIR', 'RESTER', 'CHANGER', 'COMPRENDRE', 'CHOISIR',
            'APPRENDRE', 'JOUET', 'FRANCE', 'PARIS', 'AMIS', 'AMIES', 'PAPA', 'MAMAN',
            'FRERE', 'SOEUR', 'HOMME', 'FEMME', 'ENFANT', 'GARCON', 'FILLE', 'JEUNE', 'VIEUX',
            'BEAU', 'BELLE', 'FORT', 'FAIBLE', 'RAPIDE', 'LENT', 'CONTENT', 'TRISTE',
            'NOUVEAU', 'BON', 'MEILLEUR', 'MAUVAIS', 'CHAUD', 'FROID', 'DOULOUREUX',
            'SIMPLE', 'COMPLEXE', 'PRATIQUE', 'PROPRE', 'SALE', 'BLEU', 'ROUGE', 'VERT',
            'JAUNE', 'NOIR', 'BLANC', 'GRIS', 'ROSE', 'ORANGE', 'MARCHE', 'CHANSON', 'MUSIQUE',
            'DANSE', 'THEATRE', 'CINEMA', 'LUMIERE', 'OMBRE', 'COULEUR', 'POESIE',
            'HISTOIRE', 'DEFI', 'PROJET', 'JEUX', 'BOMBE', 'TEMPS', 'HEURE', 'MINUTE', 'SECONDE',
            'SOURIRE', 'RIEN', 'QUELQUE', 'QUOI', 'POURQUOI', 'PARCE', 'QUE', 'COMMENT',
            'QUAND', 'OU', 'AVANT', 'APRES', 'PENDANT', 'TOUJOURS', 'JAMAIS', 'PARFOIS',
            'TRES', 'PEU', 'BEAUCOUP', 'TROP', 'ASSEZ', 'SEULEMENT', 'AVEC', 'SANS', 'SUR',
            'DANS', 'DEVANT', 'DERIERE', 'A COTE', 'SOUS', 'SUS', 'ENTRE', 'AUTOUR', 'CONTRE',
            'GRAND', 'PETIT', 'MINCE', 'GROS', 'COURT', 'LONG', 'HAUT', 'BAS', 'LENTEMENT',
            'RAPIDEMENT', 'FACILE', 'DIFFICILE', 'IMPORTANT', 'URGENCE', 'GAUCHE', 'DROITE',
            'NORD', 'SUD', 'EST', 'OUEST', 'CHEMIN', 'ROUTE', 'PONT', 'LAC', 'RIVIERE', 'OCEAN',
            'PLAGE', 'SABLE', 'ROCHE', 'NEIGE', 'PLUIE', 'VENT', 'TEMPETE', 'SOLEIL', 'LUNE',
            'ETOILE', 'CIEL', 'NUAGE', 'ORAGE', 'CHAINE', 'ARC', 'CERCLE', 'CARRE', 'TRIANGLE',
            'MOT', 'PHRASE', 'PAROLE', 'PARAGRAPHE', 'TEXTE', 'LIVRE', 'PAGE', 'SOURCE',
            'CODE', 'CLE', 'PORTE', 'FENETRE', 'VOLET', 'MUR', 'TABLE', 'CHAIR', 'LIT',
            'CUISINE', 'SALLE', 'BUREAU', 'JARDIN', 'PARC', 'HOPITAL', 'EGLISE', 'MAGASIN',
            'BIBLIOTHEQUE', 'USINE', 'MAIRIE', 'STATION', 'GARE', 'AEROPORT',
            'STATIONNEMENT', 'TRANSFORMATION', 'INTERACTION', 'COMMUNICATION',
            'ANTIQUITE', 'SUPERHERO', 'AUTOMOBILE', 'MANUEL', 'MUSEE', 'NATURE', 'SOCIETE',
            'RELATION', 'CREATION', 'IMAGINATION', 'GENERATION', 'INFORMATION',
            'EDUCATION', 'DIRECTION', 'PRODUCTION', 'REPRODUCTION', 'DESTRUCTION',
            'CONSTRUCTION', 'IMMERSION', 'PROFESSION', 'OPPOSITION', 'POSITION',
            'CONDITION', 'INJECTION', 'COLLECTION', 'SELECTION', 'ELECTION',
            'PRIVILEGE', 'RESPONSABLE', 'DISPONIBLE', 'INCROYABLE', 'FLEXIBLE',
            'HUMORISTE', 'MUSICIEN', 'PHOTO', 'PHYSIQUE', 'TELEPHONE', 'PHARMACIE',
            'PHARE', 'MIRACLE', 'ANIMATION', 'FASCINATION', 'DECISION', 'MISSION',
            'VERSION', 'VISION', 'CONCLUSION', 'ACTIVITE', 'CIVILITE', 'CREATIVITE', 'ACTIVITY', 'CIVILITY', 'CREATIVITY',
            'REALISATION', 'REALISME', 'SOCIALISME', 'OPTIMISME', 'ANTIDOTE',
            'SUBMARIN', 'SUBSTITUT', 'SUPERIEUR', 'OVERDOSE', 'UNDERGROUND',
            'NONCHALANT', 'NONVIOLENCE', 'SEMICOLONNE', 'SEMIFINAL', 'MULTICULTURE',
            'MULTIMEDIA', 'LINGE', 'PINGOUIN', 'RINGARD', 'BRINGUE', 'LINGUISTIQUE',
            'BUSINESS', 'USEFUL', 'USELESS', 'ROTATE', 'SITUATE', 'CREATE',
            'REALIZE', 'UTILIZE', 'ORGANIZE', 'FAMILY', 'DISCUSSION', 'DISSIMULER',
            'ANTICIPATION', 'ANTIBIOTIQUE', 'ANTICHAMBRE', 'ANTIRIDES', 'ANTIVIRUS',
            'SHAMPOOING', 'SHERIFF', 'SHAMAN', 'GHOST', 'LIGHT', 'VACUUM', 'FEELING',
            'ZOOM', 'BROOK', 'STRATEGIE', 'STRASBOURG', 'SCRABBLE', 'BACK', 'CHECK',
            'TICKET', 'BANK', 'TANK', 'LECTURE', 'ACTEUR', 'CONTACT', 'OPTIMISTE',
            'CONCEPT', 'APTE', 'FAULT', 'VOLT', 'COURAGEOUS', 'SERIOUS', 'CURIOUS'
        ];

        const VALID_WORD_SET = new Set(VALID_WORDS.map(normalizeWord));

        function buildFragmentWordMap() {
            const map = {};
            FRAGMENTS.forEach(fragment => {
                const normalizedFragment = normalizeWord(fragment);
                const words = VALID_WORDS
                    .map(normalizeWord)
                    .filter(word => word.includes(normalizedFragment));
                map[normalizedFragment] = Array.from(new Set(words));
            });
            return map;
        }

        const WORDS_BY_FRAGMENT = buildFragmentWordMap();
        const AVAILABLE_FRAGMENTS = Object.keys(WORDS_BY_FRAGMENT).filter(fragment => WORDS_BY_FRAGMENT[fragment].length > 0);

        function getWordsForFragment(fragment) {
            return WORDS_BY_FRAGMENT[normalizeWord(fragment)] || [];
        }

        function isValidWord(word) {
            return VALID_WORD_SET.has(normalizeWord(word));
        }

        function isValidWordForFragment(word, fragment) {
            return getWordsForFragment(fragment).includes(normalizeWord(word));
        }

        // ============ STATE MANAGEMENT ============
        let gameState = {
            players: [],
            currentPlayerIndex: 0,
            currentFragment: '',
            timer: 0,
            timerInterval: null,
            isGameRunning: false,
            wordHistory: [],
            currentLives: {},
            minimumTime: 6,
            maximumTime: 18
        };

        // ============ INITIALIZATION ============
        document.addEventListener('DOMContentLoaded', () => {
            initializeLobby();
            document.getElementById('playerCount').addEventListener('change', updatePlayerInputs);
            document.getElementById('startGameBtn').addEventListener('click', startGame);
            document.getElementById('submitBtn').addEventListener('click', submitWord);
            document.getElementById('restartBtn').addEventListener('click', restart);
            document.getElementById('wordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitWord();
            });
            updatePlayerInputs();
        });

        function initializeLobby() {
            updatePlayerInputs();
        }

        function updatePlayerInputs() {
            const count = parseInt(document.getElementById('playerCount').value);
            const container = document.getElementById('playerNameInputs');
            container.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.className = 'player-input';
                div.innerHTML = `
                    <span class="player-number">J${i}</span>
                    <input 
                        type="text" 
                        placeholder="Joueur ${i}"
                        value="Joueur ${i}"
                        id="playerName${i}"
                    >
                `;
                container.appendChild(div);
            }
        }

        function startGame() {
            const count = parseInt(document.getElementById('playerCount').value);
            gameState.players = [];
            gameState.currentLives = {};
            
            for (let i = 1; i <= count; i++) {
                const name = document.getElementById(`playerName${i}`).value || `Joueur ${i}`;
                gameState.players.push({
                    id: i,
                    name: name,
                    lives: 2,
                    eliminated: false
                });
                gameState.currentLives[i] = 2;
            }
            
            gameState.currentPlayerIndex = 0;
            gameState.isGameRunning = true;
            gameState.wordHistory = [];
            
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            
            nextRound();
        }

        function nextRound() {
            // Trouver le prochain joueur pas éliminé
            let attempts = 0;
            while (attempts < gameState.players.length) {
                if (!gameState.players[gameState.currentPlayerIndex].eliminated) {
                    break;
                }
                gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
                attempts++;
            }
            
            // Vérifier s'il reste au moins 1 joueur
            const activePlayers = gameState.players.filter(p => !p.eliminated);
            if (activePlayers.length === 1) {
                endGame(activePlayers[0]);
                return;
            }
            
            // Nouveau fragment
            const fragmentIndex = Math.floor(Math.random() * AVAILABLE_FRAGMENTS.length);
            gameState.currentFragment = AVAILABLE_FRAGMENTS[fragmentIndex].toUpperCase();
            document.getElementById('fragmentDisplay').textContent = gameState.currentFragment;
            
            // Nouveau timer
            gameState.timer = gameState.minimumTime + Math.floor(Math.random() * (gameState.maximumTime - gameState.minimumTime + 1));
            
            // Réinitialiser l'input
            document.getElementById('wordInput').value = '';
            document.getElementById('wordInput').focus();
            clearMessage();
            
            updatePlayersDisplay();
            startTimer();
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            
            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                updateTimerDisplay();
                
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    bombExplode();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            display.textContent = String(gameState.timer).padStart(2, '0');
            
            if (gameState.timer <= 3) {
                display.classList.add('danger');
                document.getElementById('bombElement').classList.add('bomb-danger');
            } else {
                display.classList.remove('danger');
                document.getElementById('bombElement').classList.remove('bomb-danger');
            }
        }

        function submitWord() {
            const rawWord = document.getElementById('wordInput').value.trim();
            const word = rawWord.toUpperCase();
            const normalizedWord = normalizeWord(rawWord);
            const normalizedFragment = normalizeWord(gameState.currentFragment);
            
            if (!word) {
                showMessage('Veuillez entrer un mot !', 'invalid');
                return;
            }
            
            if (word.length < 2) {
                showMessage('Le mot doit contenir au moins 2 lettres !', 'invalid');
                return;
            }
            
            if (!isValidWord(rawWord)) {
                showMessage(`✗ "${word}" n'est pas un mot reconnu.`, 'invalid');
                return;
            }

            if (!isValidWordForFragment(rawWord, gameState.currentFragment)) {
                showMessage(`✗ "${word}" n'est pas un mot valide pour le fragment "${gameState.currentFragment}".`, 'invalid');
                return;
            }
            
            // Vérifier si le mot contient le fragment
            if (normalizedWord.includes(normalizedFragment)) {
                showMessage(`✓ "${word}" est valide !`, 'valid');
                gameState.wordHistory.unshift({
                    player: gameState.players[gameState.currentPlayerIndex].name,
                    word: word,
                    fragment: gameState.currentFragment
                });
                
                // Limiter l'historique à 10 mots
                if (gameState.wordHistory.length > 10) {
                    gameState.wordHistory.pop();
                }
                updateWordHistory();
                
                // Passer au prochain joueur
                clearInterval(gameState.timerInterval);
                setTimeout(() => {
                    gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
                    nextRound();
                }, 800);
            } else {
                showMessage(`✗ "${word}" ne contient pas "${gameState.currentFragment}"`, 'invalid');
            }
            
            document.getElementById('wordInput').value = '';
        }

        function bombExplode() {
            const bombEl = document.getElementById('bombElement');
            bombEl.classList.add('exploding');
            
            // Perdre une vie
            const player = gameState.players[gameState.currentPlayerIndex];
            player.lives--;
            gameState.currentLives[player.id]--;
            
            playBombSound();
            
            if (player.lives <= 0) {
                player.eliminated = true;
                showMessage(`💥 ${player.name} est éliminé !`, 'invalid');
            } else {
                showMessage(`💥 ${player.name} a perdu une vie !`, 'invalid');
            }
            
            updatePlayersDisplay();
            
            setTimeout(() => {
                bombEl.classList.remove('exploding');
                gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
                nextRound();
            }, 1000);
        }

        function updatePlayersDisplay() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';
            
            gameState.players.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                
                if (player.eliminated) {
                    card.classList.add('eliminated');
                } else if (index === gameState.currentPlayerIndex) {
                    card.classList.add('active');
                }
                
                const lives = '<span class="heart">❤️</span>'.repeat(player.lives);
                
                card.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 8px;">${player.name}</div>
                    <div>${lives || '<span style="color: #999;">Éliminé</span>'}</div>
                    ${index === gameState.currentPlayerIndex && !player.eliminated ? '<div style="margin-top: 8px; color: #ff006e; font-weight: bold;">💣</div>' : ''}
                `;
                
                container.appendChild(card);
            });
        }

        function showMessage(text, type) {
            const display = document.getElementById('messageDisplay');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            
            display.innerHTML = '';
            display.appendChild(msg);
        }

        function clearMessage() {
            document.getElementById('messageDisplay').innerHTML = '';
        }

        function updateWordHistory() {
            const history = document.getElementById('wordHistory');
            history.innerHTML = '';
            
            gameState.wordHistory.forEach(entry => {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.textContent = `${entry.player}: "${entry.word}"`;
                history.appendChild(item);
            });
        }

        function endGame(winner) {
            clearInterval(gameState.timerInterval);
            gameState.isGameRunning = false;
            
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            
            document.getElementById('winnerDisplay').innerHTML = `
                <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
                <div style="font-size: 36px;">${winner.name}</div>
                <div style="font-size: 18px; color: #00d9ff; margin-top: 10px;">est le champion !</div>
            `;
        }

        function restart() {
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            clearInterval(gameState.timerInterval);
            initializeLobby();
        }

        function playBombSound() {
            // Créer un son simple avec Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log('Son non disponible');
            }
        }
    </script>
</body>
</html>
